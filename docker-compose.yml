services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nusantaraorigin_web
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    volumes:
      # Persistent Volume for commodities photos and 3D assets
      - ./uploads_data:/app/public/uploads
